name: Android APK

# The ES test build of the Android port: the keyboard fix (#18, #17) plus the
# Spanish work, as the side-by-side package dev.horizonlab.horizon.es — it
# installs beside a regular Horizon without touching its files or signature.
# The keystore is committed (a throwaway fork test key for this package only)
# so every build updates over the previous one: no re-download of the game
# files between tests. ANDROID.md has the same recipe for a local build.
on:
  push:
    branches: [android-es]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /home/runner/android-sdk
      # cargo-ndk looks here before ANDROID_HOME; the runner image presets these
      # at its own half-removed SDK.
      ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/27.2.12479018
      ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/27.2.12479018
      NDK_HOME: /home/runner/android-sdk/ndk/27.2.12479018
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup || true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: An SDK of our own (the runner image's has no sdkmanager on PATH)
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSfL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d "$ANDROID_HOME/ct"
          mv "$ANDROID_HOME/ct/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rmdir "$ANDROID_HOME/ct"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes | "$SDKM" --licenses >/dev/null) || true
          "$SDKM" --install "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          df -h / | tail -1

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: The side-by-side package (dev.horizonlab.horizon.es)
        run: |
          sed -i 's/package="dev.horizonlab.horizon"/package="dev.horizonlab.horizon.es"/' packaging/android/AndroidManifest.xml
          sed -i 's/android:name="\.\([A-Za-z]*"\)/android:name="dev.horizonlab.horizon.\1/' packaging/android/AndroidManifest.xml
          sed -i 's/dev.horizonlab\.horizon\.documents/dev.horizonlab.horizon.es.documents/' \
            packaging/android/AndroidManifest.xml packaging/android/java/dev/horizonlab/horizon/HorizonActivity.java
          sed -i 's/android:versionCode="36"/android:versionCode="99"/' packaging/android/AndroidManifest.xml
          sed -i 's/android:versionName="0.4.5"/android:versionName="0.4.5-es.1"/' packaging/android/AndroidManifest.xml
          sed -i 's|<string name="app_name">Horizon</string>|<string name="app_name">Horizon ES</string>|' packaging/android/res/values/strings.xml
          grep -n 'package=\|versionCode\|versionName\|authorities' packaging/android/AndroidManifest.xml | head -4

      - name: Build the APK
        env:
          HORIZON_KEYSTORE: ${{ github.workspace }}/.github/horizon-es-test.jks
          HORIZON_KEYSTORE_PASS: es-c0d3e8b6531eb64bf88e
          HORIZON_KEY_ALIAS: horizon-es
        run: PROFILE=fast bash packaging/android/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-es-apk
          path: target/android/horizon.apk
          if-no-files-found: error
          retention-days: 14
